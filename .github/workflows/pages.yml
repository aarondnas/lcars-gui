# Builds the packages and publishes the HTML demos (apps/examples/web) to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The pages live in apps/examples/web and reference ../../../packages/<package>/dist.
      # On Pages they sit at the site root, so the paths are rewritten accordingly.
      - name: Assemble site
        run: |
          mkdir -p _site/packages
          for pkg in federation romulus; do
            mkdir -p _site/packages/$pkg
            cp -r packages/$pkg/dist _site/packages/$pkg/dist
          done
          for page in apps/examples/web/*.html; do
            sed 's#\.\./\.\./\.\./packages/#packages/#g' "$page" > "_site/$(basename "$page")"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
